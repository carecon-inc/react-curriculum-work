services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: taskapp
        ports:
            - "3000:3000"
            - "5555:5555"
        volumes:
            - .:/app
        environment:
            - DATABASE_URL=mysql://root:password@db:3306/taskapp
            - DATABASE_HOST=db
            - DATABASE_USER=root
            - DATABASE_PASSWORD=password
            - DATABASE_NAME=taskapp
            - DATABASE_PORT=3306
        depends_on:
            db:
                condition: service_healthy
        command: sh -c "npm install && npm run db:generate && npm run dev"

    db:
        image: mysql:8.0
        container_name: taskapp-db
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: taskapp
        volumes:
            - db-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-ppassword",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    db-data:
