services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: taskapp
        ports:
            - "3000:3000"
            - "5555:5555"
        volumes:
            - .:/app
        environment:
            - DATABASE_URL=postgresql://postgres:password@db:5432/taskapp
        depends_on:
            db:
                condition: service_healthy
        command: sh -c "npm install && npm run db:generate && npm run dev"

    db:
        image: postgres:16-alpine
        container_name: taskapp-db
        ports:
            - "5432:5432"
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_DB: taskapp
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    db-data:
